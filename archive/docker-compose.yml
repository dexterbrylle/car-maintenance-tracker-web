version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8242:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/maintenance_tracker_prod
      - FLASK_ENV=production
      - PORT=5000
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8241:80"
    environment:
      - VITE_API_URL=http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:4.4
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
